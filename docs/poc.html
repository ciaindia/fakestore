
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stockroom — Fake Store API</title>
<style>
  :root{
    --ink:#1c1b19;
    --paper:#eae6dc;
    --card:#f6f4ee;
    --line:#c9c2b2;
    --accent:#3d5a4c;
    --accent-soft:#e4ece7;
    --warn:#8a3324;
    --mono: 'Courier New', Courier, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
  }
  .ledger-header{
    border-bottom:2px solid var(--ink);
    padding:28px clamp(16px,4vw,48px) 18px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
  }
  .ledger-header h1{
    margin:0;
    font-family:var(--mono);
    font-size:clamp(22px,3vw,32px);
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .ledger-header .stamp{
    font-family:var(--mono);
    font-size:12px;
    color:var(--accent);
    border:1px solid var(--accent);
    padding:4px 10px;
    border-radius:2px;
    letter-spacing:1px;
  }
  main{
    max-width:1100px;
    margin:0 auto;
    padding:24px clamp(16px,4vw,48px) 60px;
    display:grid;
    grid-template-columns: 1fr;
    gap:24px;
  }
  @media(min-width:920px){
    main{ grid-template-columns: 340px 1fr; align-items:start; }
  }
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:20px;
  }
  .panel h2{
    font-family:var(--mono);
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin:0 0 16px;
    padding-bottom:8px;
    border-bottom:1px dashed var(--line);
    color:var(--accent);
  }
  label{
    display:block;
    font-size:11px;
    font-family:var(--mono);
    text-transform:uppercase;
    letter-spacing:1px;
    color:#6b6558;
    margin:14px 0 4px;
  }
  label:first-of-type{margin-top:0;}
  input, select, textarea{
    width:100%;
    font-family:var(--sans);
    font-size:14px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
    color:var(--ink);
  }
  textarea{resize:vertical; min-height:60px;}
  input:focus, select:focus, textarea:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .actions{display:flex; gap:8px; margin-top:18px;}
  button{
    font-family:var(--mono);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
    padding:10px 14px;
    border-radius:3px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    transition:transform .05s ease, opacity .15s ease;
  }
  button:hover{opacity:.85;}
  button:active{transform:translateY(1px);}
  button.secondary{
    background:transparent;
    color:var(--ink);
  }
  button.danger{
    background:var(--warn);
    border-color:var(--warn);
    color:#fff;
  }
  button:disabled{opacity:.4; cursor:not-allowed;}
  #form-status{
    font-family:var(--mono);
    font-size:12px;
    margin-top:10px;
    min-height:16px;
    color:var(--accent);
  }
  #form-status.error{color:var(--warn);}

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .toolbar .count{
    font-family:var(--mono);
    font-size:12px;
    color:#6b6558;
  }
  .search-bar{
    display:flex;
    align-items:center;
    gap:8px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:4px;
    padding:9px 12px;
    margin-bottom:12px;
  }
  .search-bar svg{ flex-shrink:0; color:#8a8a86; }
  .search-bar input{
    border:none;
    padding:0;
    font-size:14px;
  }
  .search-bar input:focus{ outline:none; }
  .filter-bar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .chip{
    font-family:var(--sans);
    font-size:12px;
    padding:6px 14px;
    border:1px solid var(--line);
    border-radius:16px;
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    text-transform:none;
    letter-spacing:0;
  }
  .chip:hover{ opacity:1; border-color:var(--accent); }
  .chip.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:16px;
  }
  .card{
    background:#fff;
    border:1px solid #e2e0d8;
    border-radius:3px;
    padding:16px 14px;
    display:flex;
    flex-direction:column;
    gap:6px;
    position:relative;
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover{
    box-shadow:0 2px 10px rgba(28,27,25,0.08);
    border-color:#c9c2b2;
  }
  .card .tag{
    position:absolute;
    top:10px;
    right:10px;
    font-family:var(--mono);
    font-size:10px;
    color:#a9a49a;
    letter-spacing:.5px;
  }
  .card .thumb{
    height:130px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:6px;
  }
  .card img{
    max-height:120px;
    max-width:100%;
    object-fit:contain;
  }
  .card .cat{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:#a9a49a;
  }
  .card h3{
    margin:0;
    font-size:13px;
    font-weight:400;
    line-height:1.35;
    min-height:36px;
    color:var(--ink);
  }
  .card .rating{
    display:inline-flex;
    align-items:center;
    gap:3px;
    background:var(--accent);
    color:#fff;
    font-size:11px;
    font-weight:600;
    padding:2px 6px;
    border-radius:3px;
    width:fit-content;
  }
  .card .rating .count{
    font-weight:400;
    color:#fff;
    opacity:.85;
    margin-left:2px;
  }
  .card .price-row{
    display:flex;
    align-items:baseline;
    gap:7px;
    flex-wrap:wrap;
    margin-top:2px;
  }
  .card .price{
    font-size:17px;
    font-weight:700;
    color:var(--ink);
    font-family:var(--sans);
  }
  .card .mrp{
    font-size:12px;
    color:#a9a49a;
    text-decoration:line-through;
  }
  .card .discount{
    font-size:12px;
    color:var(--accent);
    font-weight:600;
  }
  .card .desc{
    font-size:12px;
    color:#6b6558;
    line-height:1.4;
    max-height:36px;
    overflow:hidden;
  }
  .card .add-to-cart{
    margin-top:8px;
    padding:9px 10px;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.5px;
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .card .card-actions{
    display:flex;
    gap:6px;
    margin-top:4px;
  }
  .card .card-actions button{
    flex:1;
    padding:6px 8px;
    font-size:10px;
    background:transparent;
    color:#6b6558;
    border-color:var(--line);
  }
  .card .card-actions button.danger{
    color:var(--warn);
    border-color:var(--warn);
    background:transparent;
  }
  .empty, .loading{
    font-family:var(--mono);
    font-size:13px;
    color:#6b6558;
    padding:30px 10px;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:4px;
  }
  .editing-badge{
    display:none;
    font-family:var(--mono);
    font-size:11px;
    background:var(--accent);
    color:#fff;
    padding:2px 8px;
    border-radius:2px;
    margin-bottom:10px;
  }
  .editing-badge.show{display:inline-block;}
</style>
</head>
<body>

<div class="ledger-header">
  <h1>Stockroom Ledger</h1>
  <div class="stamp">fakestoreapi.com</div>
</div>

<main>
  <section class="panel" id="form-panel">
    <h2>Add / Edit Entry</h2>
    <span class="editing-badge" id="editing-badge">Editing #<span id="editing-id"></span></span>

    <label for="f-title">Title</label>
    <input id="f-title" type="text" placeholder="Wireless mechanical keyboard">

    <div class="row2">
      <div>
        <label for="f-price">Price (USD)</label>
        <input id="f-price" type="number" step="0.01" placeholder="49.99">
      </div>
      <div>
        <label for="f-category">Category</label>
        <select id="f-category">
          <option value="electronics">electronics</option>
          <option value="jewelery">jewelery</option>
          <option value="men's clothing">men's clothing</option>
          <option value="women's clothing">women's clothing</option>
        </select>
      </div>
    </div>

    <label for="f-image">Image URL</label>
    <input id="f-image" type="text" placeholder="https://...">

    <label for="f-description">Description</label>
    <textarea id="f-description" placeholder="Short product description"></textarea>

    <div class="actions">
      <button id="btn-submit" type="button">Add entry</button>
      <button id="btn-cancel" class="secondary" type="button" style="display:none;">Cancel</button>
    </div>
    <div id="form-status"></div>
  </section>

  <section>
    <div class="search-bar">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.4"/>
        <line x1="11" y1="11" x2="15" y2="15" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      <input id="f-search" type="text" placeholder="Search for products, brands and more">
    </div>
    <div id="filter-bar" class="filter-bar"></div>
    <div class="toolbar">
      <span class="count" id="result-count">loading…</span>
      <button id="btn-refresh" class="secondary" type="button">Reload from API</button>
    </div>
    <div id="grid" class="grid"></div>
  </section>
</main>

<script>
const API = 'https://fakestoreapi.com/products';

const els = {
  title: document.getElementById('f-title'),
  price: document.getElementById('f-price'),
  category: document.getElementById('f-category'),
  image: document.getElementById('f-image'),
  description: document.getElementById('f-description'),
  submit: document.getElementById('btn-submit'),
  cancel: document.getElementById('btn-cancel'),
  refresh: document.getElementById('btn-refresh'),
  status: document.getElementById('form-status'),
  grid: document.getElementById('grid'),
  filterBar: document.getElementById('filter-bar'),
  search: document.getElementById('f-search'),
  count: document.getElementById('result-count'),
  editingBadge: document.getElementById('editing-badge'),
  editingId: document.getElementById('editing-id'),
};

let products = [];
let editingId = null; // null = create mode
let activeCategory = 'all';
let searchTerm = '';

// ---- Helpers ----

function setStatus(msg, isError = false) {
  els.status.textContent = msg;
  els.status.classList.toggle('error', isError);
}

function clearForm() {
  els.title.value = '';
  els.price.value = '';
  els.category.value = 'electronics';
  els.image.value = '';
  els.description.value = '';
}

function enterEditMode(product) {
  editingId = product.id;
  els.title.value = product.title || '';
  els.price.value = product.price ?? '';
  els.category.value = product.category || 'electronics';
  els.image.value = product.image || '';
  els.description.value = product.description || '';
  els.submit.textContent = 'Save changes';
  els.cancel.style.display = 'inline-block';
  els.editingBadge.classList.add('show');
  els.editingId.textContent = product.id;
  els.title.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function exitEditMode() {
  editingId = null;
  els.submit.textContent = 'Add entry';
  els.cancel.style.display = 'none';
  els.editingBadge.classList.remove('show');
  clearForm();
}

function readForm() {
  const title = els.title.value.trim();
  const price = parseFloat(els.price.value);
  const category = els.category.value;
  const image = els.image.value.trim() || 'https://i.pravatar.cc/150?img=1';
  const description = els.description.value.trim();

  if (!title) return { error: 'Title is required.' };
  if (isNaN(price) || price <= 0) return { error: 'Price must be a positive number.' };

  return { data: { title, price, category, image, description } };
}

// ---- Rendering ----

function getRating(p) {
  if (p.rating && typeof p.rating.rate === 'number') {
    return { rate: p.rating.rate, count: p.rating.count ?? 0 };
  }
  // Locally-created items have no rating from the API; derive a stable placeholder from the id.
  const seed = (p.id % 15) / 10; // 0.0–1.4
  return { rate: Math.min(5, Math.round((3.5 + seed) * 10) / 10), count: 0 };
}

function getPricing(p) {
  const price = Number(p.price) || 0;
  // Fake Store API has no "original price"; derive a plausible MRP/discount from the id so
  // the listing matches a real marketplace's price-with-discount pattern.
  const markup = 1.15 + ((p.id % 6) * 0.04); // 1.15–1.35
  const mrp = Math.round(price * markup * 100) / 100;
  const discountPct = mrp > price ? Math.round((1 - price / mrp) * 100) : 0;
  return { price, mrp, discountPct };
}

function categoriesInUse() {
  const set = new Set(products.map(p => p.category).filter(Boolean));
  return ['all', ...Array.from(set)];
}

function renderFilterBar() {
  const cats = categoriesInUse();
  els.filterBar.innerHTML = cats.map(cat => `
    <button class="chip ${cat === activeCategory ? 'active' : ''}" data-category="${escapeAttr(cat)}" type="button">
      ${cat === 'all' ? 'All' : escapeHtml(cat)}
    </button>
  `).join('');
}

function visibleProducts() {
  return products.filter(p => {
    const matchesCategory = activeCategory === 'all' || p.category === activeCategory;
    const matchesSearch = !searchTerm || p.title.toLowerCase().includes(searchTerm);
    return matchesCategory && matchesSearch;
  });
}

function renderGrid() {
  renderFilterBar();
  const visible = visibleProducts();

  if (!products.length) {
    els.grid.innerHTML = '<div class="empty">No products to show.</div>';
    els.count.textContent = '0 items';
    return;
  }

  if (!visible.length) {
    els.grid.innerHTML = '<div class="empty">No products match your filters.</div>';
    els.count.textContent = `0 of ${products.length} items`;
    return;
  }

  els.count.textContent = visible.length === products.length
    ? `${products.length} item${products.length === 1 ? '' : 's'}`
    : `${visible.length} of ${products.length} items`;

  els.grid.innerHTML = visible.map(p => {
    const rating = getRating(p);
    const { price, mrp, discountPct } = getPricing(p);
    return `
    <div class="card" data-id="${p.id}">
      <span class="tag">#${p.id}</span>
      <div class="cat">${escapeHtml(p.category || 'uncategorized')}</div>
      <div class="thumb">
        <img src="${escapeAttr(p.image)}" alt="${escapeAttr(p.title)}" loading="lazy"
             onerror="this.src='https://placehold.co/200x150?text=No+Image'">
      </div>
      <h3>${escapeHtml(p.title)}</h3>
      <span class="rating">${rating.rate.toFixed(1)} <span aria-hidden="true">★</span>${rating.count ? `<span class="count">(${rating.count})</span>` : ''}</span>
      <div class="price-row">
        <span class="price">$${price.toFixed(2)}</span>
        ${discountPct > 0 ? `<span class="mrp">$${mrp.toFixed(2)}</span><span class="discount">${discountPct}% off</span>` : ''}
      </div>
      <div class="desc">${escapeHtml(p.description || 'No description provided.')}</div>
      <button class="add-to-cart" data-action="add-to-cart" data-id="${p.id}" type="button">Add to cart</button>
      <div class="card-actions">
        <button class="secondary" data-action="edit" data-id="${p.id}">Edit</button>
        <button class="danger" data-action="delete" data-id="${p.id}">Delete</button>
      </div>
    </div>
  `;
  }).join('');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}
function escapeAttr(str) { return escapeHtml(str); }

// ---- API calls (Fetch API) ----

async function fetchProducts() {
  els.grid.innerHTML = '<div class="loading">Fetching products…</div>';
  try {
    const res = await fetch(`${API}?limit=20`);
    if (!res.ok) throw new Error(`GET failed: ${res.status}`);
    products = await res.json();
    renderGrid();
  } catch (err) {
    els.grid.innerHTML = `<div class="empty">Could not load products. ${escapeHtml(err.message)}</div>`;
  }
}

async function createProduct(payload) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error(`POST failed: ${res.status}`);
  const created = await res.json();
  // Fake Store API always echoes id:11 for new items; merge locally so the UI reflects the real data.
  const localItem = { id: products.length ? Math.max(...products.map(p => p.id)) + 1 : 21, ...payload, ...{ id: created.id ?? undefined } };
  const finalItem = { ...payload, id: localItem.id ?? Date.now() };
  products = [finalItem, ...products];
  renderGrid();
}

async function updateProduct(id, payload) {
  const res = await fetch(`${API}/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error(`PUT failed: ${res.status}`);
  await res.json();
  // API is a mock and doesn't persist, so update local state directly.
  products = products.map(p => p.id === id ? { ...p, ...payload, id } : p);
  renderGrid();
}

async function deleteProduct(id) {
  const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
  if (!res.ok) throw new Error(`DELETE failed: ${res.status}`);
  await res.json();
  products = products.filter(p => p.id !== id);
  renderGrid();
}

// ---- Event wiring ----

els.submit.addEventListener('click', async () => {
  const { data, error } = readForm();
  if (error) { setStatus(error, true); return; }

  els.submit.disabled = true;
  setStatus(editingId ? 'Saving changes…' : 'Adding entry…');

  try {
    if (editingId) {
      await updateProduct(editingId, data);
      setStatus(`Updated #${editingId}.`);
      exitEditMode();
    } else {
      await createProduct(data);
      setStatus('Entry added.');
      clearForm();
    }
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    els.submit.disabled = false;
  }
});

els.cancel.addEventListener('click', exitEditMode);
els.refresh.addEventListener('click', fetchProducts);

els.search.addEventListener('input', () => {
  searchTerm = els.search.value.trim().toLowerCase();
  renderGrid();
});

els.filterBar.addEventListener('click', (e) => {
  const chip = e.target.closest('button[data-category]');
  if (!chip) return;
  activeCategory = chip.dataset.category;
  renderGrid();
});

els.grid.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const id = Number(btn.dataset.id);
  const product = products.find(p => p.id === id);
  if (!product) return;

  if (btn.dataset.action === 'add-to-cart') {
    const original = btn.textContent;
    btn.textContent = 'Added ✓';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1200);
    return;
  }

  if (btn.dataset.action === 'edit') {
    enterEditMode(product);
    setStatus('');
  }

  if (btn.dataset.action === 'delete') {
    if (!confirm(`Delete "${product.title}"?`)) return;
    btn.disabled = true;
    try {
      await deleteProduct(id);
      setStatus(`Deleted #${id}.`);
      if (editingId === id) exitEditMode();
    } catch (err) {
      setStatus(err.message, true);
      btn.disabled = false;
    }
  }
});

// ---- Init ----
fetchProducts();
</script>
</body>
</html>
